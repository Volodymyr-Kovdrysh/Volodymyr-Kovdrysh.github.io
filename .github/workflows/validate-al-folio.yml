name: Validate al-folio draft
on:
  push:
    branches: [site/al-folio-v1.2]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build Jekyll site
        run: bundle exec jekyll build
      - name: Publish preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: al-folio-draft-site
          path: _site
